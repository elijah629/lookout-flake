name: Update Lookout

on:
  workflow_dispatch:
  schedule:
    - cron: "21 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Refresh upstream lock and dependency hashes
        run: nix run .#update-lookout

      - name: Verify package still builds
        run: nix build .#lookout --print-build-logs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update lookout"
          title: "chore: update lookout"
          body: |
            Automated update for:
            - `flake.lock`
            - `package.nix`
          branch: automation/update-lookout
          delete-branch: true
          labels: |
            dependencies
            automated
